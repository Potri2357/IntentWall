version: "3.9"

services:
  intentwall-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: intentwall-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./intentwall.db:/app/intentwall.db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  intentwall-web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: intentwall-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - intentwall-api
